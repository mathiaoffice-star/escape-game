 if(onlineUser)return onlineUser;if(onlineReady)return onlineReady;

 try{const user=await ensureOnlineUser();const {error}=await sbClient.from('player_profiles').upsert({id:user.id,username:name,updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error;try{localStorage.setItem(DEVICE_NICK_KEY,name);}catch(e){}renderRanking();if(gameOver)saveRunScore();}catch(e){alert('登録できませんでした。通信状態を確認してね。');console.error(e);}}
async function saveRunScore(){if(scoreSaved)return;const name=getNickname();if(!name){renderRanking();showOnlineStatus('ランキング登録には、先にPLAYERからニックネームを登録してね。');return;}scoreSaved=true;const score=survival*10+kills*100;
