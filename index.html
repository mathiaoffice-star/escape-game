   if(__nnyaataOn){ctx.fillStyle='rgba(245,158,11,.14)';ctx.fillRect(player.x-__attackSide/2,player.y-__attackSide/2,__attackSide,__attackSide);ctx.strokeRect(player.x-__attackSide/2,player.y-__attackSide/2,__attackSide,__attackSide);}
   else{ctx.beginPath();ctx.arc(player.x,player.y,__attackSide/2,0,Math.PI*2);ctx.stroke();}
 } `);
})();
// Nnyaata's attack hit area must match its square visual; keep the original circular hit area for other characters.
(function(){
 const oldFilter=".filter(item=>item.d<=attackRange)";
 if(!html.includes(oldFilter)){console.warn('[Nnyaata square attack] hit area signature not found');return;}
 html=html.replace(oldFilter,`.filter(item=>{
      const __nnyaataOn=window.__shamarupiSelectedCharacter==='nnyaata'||(()=>{try{const c=JSON.parse(localStorage.getItem('shamarupiWarV1')||'{}');return c.selectedCharacter==='nnyaata'&&(c.characters||[]).includes('nnyaata');}catch(e){return false;}})();
      return __nnyaataOn?Math.max(Math.abs(item.e.x-player.x),Math.abs(item.e.y-player.y))<=attackRange:item.d<=attackRange;
    })`);
})();
// SHAMARUPI_NORMAL_CHARACTER_RENDER_BRIDGE
// playerImg may be a private lexical variable, so patch the renderer inside the game HTML
// instead of trying to reach it through window.playerImg from an external script.
(function(){
 const fn=/function\s+drawImageOrFallback\s*\(\s*img\s*,\s*x\s*,\s*y\s*,\s*size\s*,\s*isPlayer\s*\)\s*\{/;
 if(!fn.test(html)){console.warn('[character bridge] renderer signature not found');return;}
 html=html.replace(fn, function(opening){
  return opening + `
    if(isPlayer && window.__shamarupiCharacterImage){
      const __characterSrc=window.__shamarupiCharacterImage;
      let __characterImg=window.__shamarupiCharacterImageObject;
      if(!__characterImg || __characterImg.src!==new URL(__characterSrc,document.baseURI).href){
        __characterImg=new Image();
        __characterImg.src=__characterSrc;
        window.__shamarupiCharacterImageObject=__characterImg;
      }
      if(__characterImg.complete && __characterImg.naturalWidth) img=__characterImg;
    }
  `;
 });
})();
document.open();document.write(html);document.close();
